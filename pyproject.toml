[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcup-2026-dashboard"
version = "0.1.0"
description = "Dashboard interactivo del Mundial FIFA 2026 con Python, SQLite y Plotly."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "plotly>=5.18.0",
    "pandas>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Gate = baseline medido (64% core 2026-09-21). Subir solo con tests reales nuevos,
# nunca bajando el gate para "pasar".
addopts = "-q -ra --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=60"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
# Omitido: scripts de visualización/reporte/seed sin lógica testeable a nivel unitario
# (se verifican vía smoke tests + revisión visual). El resto del core sí se testea.
omit = ["src/app.py", "src/export_visualizations.py", "src/generate_report.py", "src/historical_data.py"]
branch = true

[tool.coverage.report]
skip_covered = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.paths]
source = ["src"]