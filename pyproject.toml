[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcup-2026-dashboard"
version = "0.1.0"
description = "Dashboard interactivo del Mundial FIFA 2026 con Python, SQLite, Streamlit y Plotly."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
omit = ["src/app.py"]
branch = true

[tool.coverage.report]
skip_covered = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.paths]
source = ["src"]